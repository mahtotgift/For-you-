<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Special Letter</title>
<style>
:root{--bg:#07060a;--fg:#f3e6dc;--btn:#2a1d22;--bd:#5a3b44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060a;--fg:#f3e6dc;--btn:#2a1d22;--bd:#5a3b44}}
:root[data-theme="dark"]{--bg:#07060a;--fg:#f3e6dc;--btn:#2a1d22;--bd:#5a3b44}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
canvas{width:min(96vw,calc((100vh - 120px)*9/7));aspect-ratio:9/7;max-width:100%;background:#040306;border-radius:10px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,label{background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer}
input[type=file]{display:none}
.bar[hidden]{display:none}
#msg{background:var(--btn);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font-size:15px;width:200px}
#gear{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:38px;height:38px;padding:0;border-radius:50%;opacity:.25}
#gear:hover{opacity:.8}
canvas{cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="900" height="700"></canvas>
<div class="bar" id="panel" hidden>
  <label>Photo<input id="photo" type="file" accept="image/*"></label>
  <input id="msg" type="text" placeholder="Message" maxlength="40">
</div>
<button id="gear" aria-label="Customize">+</button>

}

function rose(img){
  o.fillStyle="#000";o.fillRect(0,0,W,H);
  const h=650,w=img.width*h/img.height;
  o.drawImage(img,(W-w)/2,25,w,h);

function photoScene(img){
  o.fillStyle="#000";o.fillRect(0,0,W,H);
  const s=Math.min(560/img.width,620/img.height),w=img.width*s,h=img.height*s;
  o.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}
function sample(){
  const d=o.getImageData(0,0,W,H).data,pts=[];
  for(let i=0;i<d.length;i+=4){if(Math.max(d[i],d[i+1],d[i+2])>40)pts.push(i)}
  const x=new Float32Array(N),y=new Float32Array(N),c=new Float32Array(N*3);
  for(let k=0;k<N;k++){
    const i=pts.length?pts[(Math.random()*pts.length)|0]:0,p=i/4;
    x[k]=p%W;y[k]=(p/W)|0;
    for(let j=0;j<3;j++)c[k*3+j]=Math.min(255,d[i+j]*1.3+25);
  }
  return{x,y,c};
}

  for(let i=0;i<N;i++){
    vx[i]+=(T.x[i]-px[i])*9*dt;vy[i]+=(T.y[i]-py[i])*9*dt;
    vx[i]=vx[i]*.86+(Math.random()-.5)*10;vy[i]=vy[i]*.86+(Math.random()-.5)*10;
    px[i]+=vx[i]*dt*4;py[i]+=vy[i]*dt*4;
    const k=Math.min(1,4*dt);
    for(let j=0;j<3;j++)col[i*3+j]+=(T.c[i*3+j]-col[i*3+j])*k;
    ctx.fillStyle=`rgb(${col[i*3]|0},${col[i*3+1]|0},${col[i*3+2]|0})`;
    ctx.fillText(CH[gid[i]],px[i],py[i]);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
